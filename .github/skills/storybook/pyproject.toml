[project]
name = "storybook"
version = "0.1.0"
description = "Children's storybook processor — page breaking, palette extraction, and PDF generation"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "Jinja2>=3.0",
    "playwright>=1.40",
]

[project.scripts]
storybook = "storybook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/storybook"]

[tool.hatch.build.targets.wheel.sources]
"scripts" = ""
