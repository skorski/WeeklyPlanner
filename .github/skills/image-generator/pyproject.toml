[project]
name = "image-gen"
version = "0.1.0"
description = "Azure OpenAI image generation, modification, and prompt refinement toolkit"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
]

[project.scripts]
image-gen = "image_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/image_gen"]

# Map the package so uv/pip finds image_gen inside scripts/
[tool.hatch.build.targets.wheel.sources]
"scripts" = ""
